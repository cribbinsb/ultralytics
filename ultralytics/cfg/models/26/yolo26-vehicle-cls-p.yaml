# YOLO26 vehicle multi-head classifier + single-instance plate-box branch (P4).
# As yolo26-vehicle-cls but VehicleClassify takes [P4, P5] and plate_box=True
# (see ubon_cstuff docs/research/ALPR.md 7b). Concat vector: 167 + 5 = 172.
# Backbone matches yolo26-cls; head is VehicleClassify.

# Parameters
nc: 106 # make classes (ClassificationModel compatibility)
colour_nc: 11
type_nc: 14
role_nc: 19
make_nc: 106
view_nc: 8
quality_nc: 7
plate_nc: 2
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 2, C2PSA, [1024]] # 9

# Vehicle multi-head
head:
  - [[6, 9], 1, VehicleClassify, [colour_nc, type_nc, role_nc, make_nc, view_nc, quality_nc, plate_nc, True]]
